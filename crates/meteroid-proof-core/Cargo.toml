[package]
name = "meteroid-proof-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Companion re-implementations for proof/ — pure decision functions (integers/enums only, no I/O, no floats) cross-checked against proof/MeteroidVerify/*.lean by shared vectors/*.json test vectors. Not linked into meteroid's own binaries; a verification-only crate. Licensed Apache-2.0, distinct from the rest of this repository (AGPL-3.0-only) — see LICENSE."

[dependencies]
meteroid-pure-core = { path = "../meteroid-pure-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
common-utils = { path = "../common-utils" }
rust_decimal = { workspace = true }
